interface:
  display_name: "Transcript Refine"
  short_description: "三段主线统一机械操作，模型集中整理和复核，默认本地交付"
  default_prompt: "Use $transcript-refine 整理逐字稿，按当前主说明执行三段主线。模型填输入，程序生成对照和报告。默认本地，保留原笔记；程序通过不等于语义正确。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "remote"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
